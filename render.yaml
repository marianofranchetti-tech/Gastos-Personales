# Deploy de la app web en Render (sitio estático).
#
# Es el build de Expo para web: React Native Web + SQLite corriendo en el
# navegador vía wa-sqlite (WASM). Con Supabase configurado, cada visitante
# entra con su cuenta y sus datos se sincronizan con la nube (ver SUPABASE.md);
# sin esas variables, la base vive solo en el navegador, como antes.
#
# Verificado que NO hacen falta headers COOP/COEP: el build usa un VFS que no
# necesita SharedArrayBuffer. No los agregues "por las dudas": COEP require-corp
# bloquea recursos cross-origin y rompe más de lo que arregla.
services:
  - type: web
    name: fluxo-app
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Expo SDK 54 necesita Node 20+. Fijamos la versión para que un cambio
      # del default de Render no rompa un build que hoy anda.
      - key: NODE_VERSION
        value: "22.22.2"
      # Supabase (ver SUPABASE.md). Se cargan a mano en el panel de Render:
      # sync: false las deja fuera del repo. Expo las mete en el bundle al
      # buildear, así que cambiarlas pide un deploy nuevo.
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    headers:
      # El bundle y el wasm llevan hash en el nombre: son inmutables.
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html no: si se cachea, el usuario queda clavado en una versión vieja.
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Una sola página: cualquier ruta cae en index.html. Hoy la navegación es
      # por estado, pero esto deja lugar a expo-router sin tener que volver acá.
      - type: rewrite
        source: /*
        destination: /index.html
